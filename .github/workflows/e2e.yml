name: E2E Instant Navigation

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web-seo/package-lock.json

      - name: Install dependencies
        run: npm ci && npm --prefix apps/web-seo ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck Angular app
        run: npx tsc -p apps/web-seo/tsconfig.app.json --noEmit

      - name: Run Playwright E2E tests against Firestore Emulator
        run: npx -y firebase-tools@latest emulators:exec --only firestore --project terraco-a5ff7 "npm run firestore:seed:emulator && npm run test:e2e"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
