<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 384 148"
  fill="none"
  aria-hidden="true"
  focusable="false"
  class="block h-full w-auto max-w-full"
>
  <defs>
    <!-- Minimalist diagonal louver pattern (airy, light, zero heavy outlines) -->
    <pattern id="mw-louver-l" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#FAF8F4" />
      <path d="M-1 9L9 -1" stroke="#1C1B19" stroke-width="0.9" opacity="0.22" />
    </pattern>
    <pattern id="mw-louver-r" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#FAF8F4" />
      <path d="M-1 -1L9 9" stroke="#1C1B19" stroke-width="0.9" opacity="0.22" />
    </pattern>

    <clipPath id="mw-min-glass-1">
      <path d="M36 36Q64 25 92 36V110H36V36Z" />
    </clipPath>
    <clipPath id="mw-min-glass-2">
      <path d="M164 36Q192 25 220 36V110H164V36Z" />
    </clipPath>
    <clipPath id="mw-min-glass-3">
      <path d="M292 36Q320 25 348 36V110H292V36Z" />
    </clipPath>
  </defs>

  <!-- =============================================================== -->
  <!-- WINDOW 1 (LEFT): Urban Leaf Green (#1F6F50)                     -->
  <!-- =============================================================== -->
  <g id="window-leaf">
    <!-- Sculpted colonial cornice -->
    <path
      d="M27 24C37 22 48 12 64 12C80 12 91 22 101 24L98 28C89 26 78 18 64 18C50 18 39 26 30 28Z"
      fill="#F7C957"
    />

    <!-- Segmental-arched frame -->
    <path d="M30 32Q64 19 98 32V116H30V32Z" fill="#1F6F50" />

    <!-- Calm sunlit window opening -->
    <g clip-path="url(#mw-min-glass-1)">
      <rect x="36" y="25" width="56" height="85" fill="#173A2B" />
      <rect x="36" y="25" width="56" height="47" fill="#FFF6DC" />
      <circle cx="74" cy="42" r="14" fill="#F7C957" opacity="0.55" />
      <!-- Minimalist 2x2 upper sash mullions -->
      <path d="M64 26V72M36 52H92M36 72H92" stroke="#1F6F50" stroke-width="2" />
    </g>

    <!-- Open folding shutters -->
    <path d="M10 34L28 36V113L11.5 111Z" fill="#1F6F50" />
    <path d="M13.5 38.5L24.5 40V108.5L14.5 107Z" fill="url(#mw-louver-l)" />

    <path d="M100 36L118 34L116.5 111L100 113Z" fill="#1F6F50" />
    <path d="M103.5 40L114.5 38.5L113.5 107L103.5 108.5Z" fill="url(#mw-louver-r)" />

    <!-- Minimalist foliage & blossoms -->
    <path d="M40 115C38 106 45 102 51 107C53 102 61 101 65 107C70 101 78 103 80 109C85 106 90 109 88 115Z" fill="#2E8B67" />
    <circle cx="46" cy="109" r="2.6" fill="#FAF8F4" />
    <circle cx="59" cy="107" r="2.6" fill="#F06A36" />
    <circle cx="72" cy="109" r="2.6" fill="#F7C957" />
    <circle cx="82" cy="110" r="2.3" fill="#FAF8F4" />

    <!-- Sleek graphite flower box -->
    <path d="M35 116H93L90.5 131H37.5Z" fill="#1C1B19" />
    <path d="M45 118V129M55 118V129M64 118V129M73 118V129M83 118V129" stroke="#FAF8F4" stroke-width="1.1" opacity="0.28" />
  </g>

