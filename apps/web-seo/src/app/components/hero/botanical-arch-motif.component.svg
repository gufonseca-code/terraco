    <circle cx="302" cy="109" r="2.6" fill="#F06A36" />
    <circle cx="315" cy="107" r="2.6" fill="#FAF8F4" />
    <circle cx="328" cy="109" r="2.6" fill="#F7C957" />
    <circle cx="338" cy="110" r="2.3" fill="#F06A36" />

