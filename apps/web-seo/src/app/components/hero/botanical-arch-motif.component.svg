      <path d="M-1 -1L7 7M5 -1L7 1M-1 5L1 7" stroke="#1C1B19" stroke-width="0.95" opacity="0.62" />
      <path d="M2 -1L7 4M-1 2L4 7" stroke="#1C1B19" stroke-width="0.55" opacity="0.28" />
