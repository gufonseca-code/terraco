    <path d="M291 116H349L346.5 131H293.5Z" fill="#1C1B19" />
    <path d="M301 118V129M311 118V129M320 118V129M329 118V129M339 118V129" stroke="#FAF8F4" stroke-width="1.1" opacity="0.28" />
