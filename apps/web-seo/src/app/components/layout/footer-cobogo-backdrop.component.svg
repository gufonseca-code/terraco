<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1440 340"
  preserveAspectRatio="xMinYMid slice"
  fill="none"
  aria-hidden="true"
  focusable="false"
  class="block h-full w-full"
>
  <defs>
    <!-- Warm cream paper base -->
    <linearGradient id="fc-paper-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F4" />
      <stop offset="100%" stop-color="#F6E3B4" />
    </linearGradient>

    <!-- Golden-hour backlighting -->
    <radialGradient id="fc-golden-glow" cx="70%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#F7C957" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#FAF8F4" stop-opacity="0" />
    </radialGradient>

    <!-- Deep canopy depth -->
    <linearGradient id="fc-canopy-depth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#103626" />
      <stop offset="100%" stop-color="#1C5E44" />
    </linearGradient>

    <!-- 8-Petal Brazilian floral ceramic cobogó tile (60x60) -->
    <pattern id="fc-cobogo-tile" width="60" height="60" patternUnits="userSpaceOnUse">
      <g stroke="#C84E22" stroke-linecap="round" stroke-linejoin="round" opacity="0.55">
        <rect x="2" y="2" width="56" height="56" rx="2" stroke-width="3" />
        <path d="M30 4C24 14 24 22 30 25C35 22 35 14 30 4Z" stroke-width="2" />
        <path d="M30 55C24 46 24 38 30 34C35 38 35 46 30 55Z" stroke-width="2" />
        <path d="M4 30C14 24 22 24 25 30C22 35 14 35 4 30Z" stroke-width="2" />
        <path d="M56 30C46 24 38 24 34 30C38 35 46 35 56 30Z" stroke-width="2" />
        <circle cx="30" cy="30" r="4" stroke-width="2" />
      </g>
      <rect x="0.4" y="0.4" width="59.2" height="59.2" stroke="#9B3915" stroke-width="0.8" opacity="0.2" />
    </pattern>
  </defs>

  <!-- Paper base + golden glow -->
  <rect width="1440" height="340" fill="url(#fc-paper-base)" />
  <rect width="1440" height="340" fill="url(#fc-golden-glow)" />

  <!-- Cobogó tile wall -->
  <rect width="1440" height="340" fill="url(#fc-cobogo-tile)" />

  <!-- Deep left canopy -->
  <path
    d="M-24 -24H596C582 8 598 38 572 62C592 86 580 122 550 140C568 168 552 204 522 222C536 254 516 292 486 314C494 334 482 350 462 360H-24Z"
    fill="url(#fc-canopy-depth)"
  />
</svg>
