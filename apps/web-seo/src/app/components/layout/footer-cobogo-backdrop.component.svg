<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1440 340"
  preserveAspectRatio="xMinYMid slice"
  fill="none"
  aria-hidden="true"
  focusable="false"
  class="block h-full w-full"
>
  <defs>
    <!-- Base warm cream paper & golden-hour backlighting -->
    <linearGradient id="fc-paper-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F4" />
      <stop offset="48%" stop-color="#F7F1E3" />
      <stop offset="100%" stop-color="#F6E5BE" />
    </linearGradient>

    <!-- Primary golden-hour backlit glow pouring through the cobogó openings -->
    <radialGradient id="fc-golden-glow-main" cx="68%" cy="76%" r="58%">
      <stop offset="0%" stop-color="#F7C957" stop-opacity="0.72" />
      <stop offset="38%" stop-color="#F9D87C" stop-opacity="0.46" />
      <stop offset="72%" stop-color="#FFF2CC" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#FAF8F4" stop-opacity="0" />
    </radialGradient>

    <!-- Secondary warm terracotta-amber sunset bounce from the lower edge -->
    <radialGradient id="fc-golden-glow-warm" cx="88%" cy="28%" r="44%">
      <stop offset="0%" stop-color="#F06A36" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#F7C957" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FAF8F4" stop-opacity="0" />
    </radialGradient>

    <!-- Soft warm-cream reading halo behind the left footer brand & description -->
    <radialGradient id="fc-reading-halo" cx="22%" cy="46%" r="36%">
      <stop offset="0%" stop-color="#FAF8F4" stop-opacity="0.80" />
      <stop offset="56%" stop-color="#FAF8F4" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#FAF8F4" stop-opacity="0" />
    </radialGradient>

    <!-- Top edge gentle paper blend into the section above -->
    <linearGradient id="fc-top-blend" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F4" stop-opacity="0.48" />
      <stop offset="22%" stop-color="#FAF8F4" stop-opacity="0" />
    </linearGradient>

    <!-- Risograph subtle halftone dot screen -->
    <pattern id="fc-riso-halftone" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.85" fill="#D95724" opacity="0.085" />
      <circle cx="6" cy="6" r="0.7" fill="#F7C957" opacity="0.14" />
    </pattern>

    <!-- 8-Petal Brazilian Floral Ceramic Cobogó Tile (60x60) -->
    <pattern id="fc-cobogo-tile" width="60" height="60" patternUnits="userSpaceOnUse">
      <!-- Risograph overprint highlight shift (golden solar rim) -->
      <g transform="translate(1.1 0.9)" stroke="#F7C957" stroke-linecap="round" stroke-linejoin="round" opacity="0.42">
        <rect x="2.2" y="2.2" width="55.6" height="55.6" rx="2.5" stroke-width="4.2" />
        <path d="M30 5C25 14 25 22 30 25C35 22 35 14 30 5Z" stroke-width="2.1" />
        <path d="M30 55C25 46 25 38 30 35C35 38 35 46 30 55Z" stroke-width="2.1" />
        <path d="M5 30C14 25 22 25 25 30C22 35 14 35 5 30Z" stroke-width="2.1" />
        <path d="M55 30C46 25 38 25 35 30C38 35 46 35 55 30Z" stroke-width="2.1" />
        <path d="M9.5 9.5C18 13.5 23.5 19 26.2 26.2C19 23.5 13.5 18 9.5 9.5Z" stroke-width="1.9" />
        <path d="M50.5 9.5C42 13.5 36.5 19 33.8 26.2C41 23.5 46.5 18 50.5 9.5Z" stroke-width="1.9" />
        <path d="M9.5 50.5C18 46.5 23.5 41 26.2 33.8C19 36.5 13.5 42 9.5 50.5Z" stroke-width="1.9" />
        <path d="M50.5 50.5C42 46.5 36.5 41 33.8 33.8C41 36.5 46.5 42 50.5 50.5Z" stroke-width="1.9" />
      </g>

      <!-- Main terracotta clay cobogó ribs -->
      <g stroke="#CC5326" stroke-linecap="round" stroke-linejoin="round" opacity="0.56">
        <!-- Outer ceramic block frame -->
        <rect x="2.2" y="2.2" width="55.6" height="55.6" rx="2.5" stroke-width="4.4" />
        <!-- 4 Cardinal floral petals -->
        <path d="M30 4.5C24.5 14 24.5 22 30 25.5C35.5 22 35.5 14 30 4.5Z" stroke-width="2.4" />
        <path d="M30 55.5C24.5 46 24.5 38 30 34.5C35.5 38 35.5 46 30 55.5Z" stroke-width="2.4" />
        <path d="M4.5 30C14 24.5 22 24.5 25.5 30C22 35.5 14 35.5 4.5 30Z" stroke-width="2.4" />
        <path d="M55.5 30C46 24.5 38 24.5 34.5 30C38 35.5 46 35.5 55.5 30Z" stroke-width="2.4" />
        <!-- 4 Diagonal floral petals -->
        <path d="M8.5 8.5C17.8 13 23.5 18.8 26.5 26.5C18.8 23.5 13 17.8 8.5 8.5Z" stroke-width="2.1" />
        <path d="M51.5 8.5C42.2 13 36.5 18.8 33.5 26.5C41.2 23.5 47 17.8 51.5 8.5Z" stroke-width="2.1" />
        <path d="M8.5 51.5C17.8 47 23.5 41.2 26.5 33.5C18.8 36.5 13 42.2 8.5 51.5Z" stroke-width="2.1" />
        <path d="M51.5 51.5C42.2 47 36.5 41.2 33.5 33.5C41.2 36.5 47 42.2 51.5 51.5Z" stroke-width="2.1" />
        <!-- Central clay ring -->
        <circle cx="30" cy="30" r="5" stroke-width="2.6" />
      </g>

      <!-- Subtle terracotta bevel depth & mortar seam -->
      <rect x="0.4" y="0.4" width="59.2" height="59.2" stroke="#9B3915" stroke-width="0.8" opacity="0.22" />
      <circle cx="30" cy="30" r="2.2" fill="#FFF6DC" opacity="0.45" />
    </pattern>

    <!-- Reusable pinnate compound tropical leaf sprig (Urban Leaf Green) -->
    <g id="fc-leaf-sprig">
      <path d="M0 0C22 14 48 25 84 31" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none" />
      <!-- Upper leaflets -->
      <path d="M12 6C14 -4 23 -9 29 -4C25 3 19 7 12 6Z" fill="currentColor" />
      <path d="M26 13C29 2 39 -2 45 3C40 10 34 14 26 13Z" fill="currentColor" />
      <path d="M41 20C45 10 55 6 61 11C56 17 49 21 41 20Z" fill="currentColor" />
      <path d="M57 25C61 16 70 13 75 18C70 23 64 26 57 25Z" fill="currentColor" />
      <path d="M72 29C77 22 85 21 90 25C85 30 79 31 72 29Z" fill="currentColor" />
      <!-- Lower leaflets -->
      <path d="M10 8C4 16 3 25 10 28C16 23 17 15 10 8Z" fill="currentColor" />
      <path d="M24 15C18 24 18 33 25 35C31 30 31 22 24 15Z" fill="currentColor" />
      <path d="M39 22C34 30 34 39 41 41C47 36 46 28 39 22Z" fill="currentColor" />
      <path d="M55 27C51 35 52 43 58 44C63 39 62 32 55 27Z" fill="currentColor" />
      <path d="M70 31C67 38 69 44 75 45C79 40 77 34 70 31Z" fill="currentColor" />
    </g>

    <!-- Smaller delicate secondary leaf frond -->
    <g id="fc-leaf-twig">
      <path d="M0 0C16 6 34 10 56 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none" />
      <path d="M9 3C11 -4 18 -7 23 -3C19 2 14 4 9 3Z" fill="currentColor" />
      <path d="M22 6C25 -1 32 -3 36 1C32 6 27 7 22 6Z" fill="currentColor" />
      <path d="M36 9C39 3 46 1 50 5C46 9 41 10 36 9Z" fill="currentColor" />
      <path d="M49 11C53 6 59 5 63 9C59 13 54 13 49 11Z" fill="currentColor" />
      <path d="M8 5C4 11 4 18 9 20C14 16 14 10 8 5Z" fill="currentColor" />
      <path d="M21 8C17 14 17 21 22 22C27 19 26 13 21 8Z" fill="currentColor" />
      <path d="M35 11C31 17 32 23 37 24C41 20 40 15 35 11Z" fill="currentColor" />
    </g>

    <!-- Tactile Risograph paper & soy-ink grain filter -->
    <filter id="fc-riso-grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.78"
        numOctaves="3"
        seed="7"
        stitchTiles="stitch"
        result="noise"
      />
      <feColorMatrix
        type="matrix"
        values="
          0.35 0 0 0 0.22
          0 0.30 0 0 0.16
          0 0 0.24 0 0.10
          0 0 0 0.24 0"
        in="noise"
      />
    </filter>
  </defs>

  <!-- 1. Warm cream paper base & golden-hour backlighting -->
  <rect width="1440" height="340" fill="url(#fc-paper-base)" />
  <rect width="1440" height="340" fill="url(#fc-golden-glow-main)" />
  <rect width="1440" height="340" fill="url(#fc-golden-glow-warm)" />

  <!-- Subtle diagonal golden-hour sunbeams streaming behind the cobogó -->
  <g opacity="0.28">
    <polygon points="520,0 740,0 560,340 340,340" fill="#FFF6DC" />
    <polygon points="840,0 1120,0 910,340 630,340" fill="#F7C957" opacity="0.55" />
    <polygon points="1180,0 1380,0 1200,340 1000,340" fill="#FFF6DC" opacity="0.7" />
  </g>

  <!-- 2. Full-bleed 8-petal floral terracotta cobogó wall -->
  <rect width="1440" height="340" fill="url(#fc-cobogo-tile)" />
  <rect width="1440" height="340" fill="url(#fc-riso-halftone)" />

  <!-- 3. Soft cast shadows from overhanging left foliage onto the cobogó wall -->
  <g transform="translate(12 10)" color="#17573E" opacity="0.11">
    <use href="#fc-leaf-sprig" transform="translate(-14 -12) rotate(18) scale(2.15)" />
    <use href="#fc-leaf-sprig" transform="translate(-26 42) rotate(32) scale(2.05)" />
    <use href="#fc-leaf-sprig" transform="translate(48 -18) rotate(24) scale(1.85)" />
    <use href="#fc-leaf-sprig" transform="translate(-18 158) rotate(14) scale(1.9)" />
    <use href="#fc-leaf-twig" transform="translate(210 12) rotate(28) scale(1.75)" />
    <use href="#fc-leaf-twig" transform="translate(145 142) rotate(42) scale(1.6)" />
  </g>

  <!-- 4. Sunlit back-layer botanical branches (Risograph sage/olive overprint) -->
  <g color="#4D8A65" opacity="0.52">
    <path
      d="M-12 24C84 18 176 28 286 78M14 96C98 118 172 162 244 236M-8 178C68 192 132 232 192 296"
      stroke="currentColor"
      stroke-width="2.4"
      stroke-linecap="round"
    />
    <use href="#fc-leaf-sprig" transform="translate(68 -16) rotate(22) scale(1.8)" />
    <use href="#fc-leaf-twig" transform="translate(228 16) rotate(30) scale(1.75)" />
    <use href="#fc-leaf-twig" transform="translate(318 66) rotate(44) scale(1.5)" />
    <use href="#fc-leaf-sprig" transform="translate(96 108) rotate(46) scale(1.6)" />
    <use href="#fc-leaf-twig" transform="translate(186 196) rotate(56) scale(1.45)" />
    <use href="#fc-leaf-sprig" transform="translate(-12 224) rotate(24) scale(1.65)" />
  </g>

  <!-- 5. Main Urban Leaf Green overhanging branches (left cascade + subtle right accent) -->
  <g color="#1F6F50" opacity="0.72">
    <!-- Primary organic branch stems -->
    <path
      d="M-18 -8C42 28 128 36 232 20C308 8 364 44 416 98"
      stroke="currentColor"
      stroke-width="2.6"
      stroke-linecap="round"
    />
    <path
      d="M-14 64C48 96 98 144 152 214"
      stroke="currentColor"
      stroke-width="2.4"
      stroke-linecap="round"
    />
    <path
      d="M-16 146C28 188 62 242 94 312"
      stroke="currentColor"
      stroke-width="2.2"
      stroke-linecap="round"
    />

    <!-- Left cascading compound leaf clusters -->
    <use href="#fc-leaf-sprig" transform="translate(-18 -14) rotate(14) scale(2.05)" />
    <use href="#fc-leaf-sprig" transform="translate(88 -26) rotate(12) scale(1.65)" />
    <use href="#fc-leaf-sprig" transform="translate(-28 52) rotate(28) scale(2.0)" />
    <use href="#fc-leaf-twig" transform="translate(178 14) rotate(20) scale(1.6)" />
    <use href="#fc-leaf-twig" transform="translate(296 34) rotate(38) scale(1.5)" />
    <use href="#fc-leaf-sprig" transform="translate(-24 148) rotate(20) scale(1.85)" />
    <use href="#fc-leaf-twig" transform="translate(76 168) rotate(52) scale(1.55)" />
    <use href="#fc-leaf-sprig" transform="translate(-22 248) rotate(12) scale(1.55)" />

    <!-- Far-right whisper of foliage framing the edge -->
    <use href="#fc-leaf-twig" transform="translate(1456 26) rotate(154) scale(1.55)" />
    <use href="#fc-leaf-twig" transform="translate(1458 214) rotate(196) scale(1.35)" />
  </g>

  <!-- 6. Deep Leaf foreground accents & golden-hour sunlit leaf tips -->
  <g color="#17573E" opacity="0.62">
    <use href="#fc-leaf-twig" transform="translate(-16 12) rotate(38) scale(1.65)" />
    <use href="#fc-leaf-twig" transform="translate(-18 104) rotate(48) scale(1.55)" />
    <use href="#fc-leaf-twig" transform="translate(-12 206) rotate(32) scale(1.4)" />
  </g>
  <g color="#8CA048" opacity="0.48">
    <use href="#fc-leaf-twig" transform="translate(342 52) rotate(46) scale(1.35)" />
    <use href="#fc-leaf-twig" transform="translate(154 134) rotate(34) scale(1.3)" />
    <use href="#fc-leaf-twig" transform="translate(1448 34) rotate(160) scale(1.2)" />
  </g>

  <!-- 7. Localized warm-cream reading halo behind the footer brand & tagline -->
  <rect width="1440" height="340" fill="url(#fc-reading-halo)" />
  <rect width="1440" height="340" fill="url(#fc-top-blend)" />

  <!-- 8. Authentic Risograph paper & soy-ink grain overlay -->
  <rect width="1440" height="340" filter="url(#fc-riso-grain)" opacity="0.22" />
</svg>
